<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0d0d0d;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .player {
            width: 100%;
            max-width: 850px;
            background: #171717;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        h1 {
            margin: 0 0 5px;
            font-size: 32px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 25px;
        }

        .drop-zone {
            border: 2px dashed #444;
            border-radius: 15px;
            padding: 45px 20px;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .drop-zone:hover,
        .drop-zone.dragging {
            border-color: white;
            background: #202020;
        }

        .drop-zone .icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .drop-zone p {
            margin: 8px 0;
        }

        .hint {
            color: #777;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .now-playing {
            background: #202020;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .now-playing-label {
            color: #777;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #currentSong {
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background: #292929;
            border: none;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #3a3a3a;
        }

        .clear {
            margin-left: auto;
        }

        .playlist {
            margin-top: 20px;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .playlist-header h2 {
            margin: 0;
            font-size: 18px;
        }

        #songCount {
            color: #777;
            font-size: 14px;
        }

        .song {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.15s;
        }

        .song:hover {
            background: #242424;
        }

        .song.active {
            background: #303030;
        }

        .song-number {
            width: 25px;
            color: #777;
            text-align: center;
        }

        .song-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .song-play {
            color: #aaa;
        }

        .empty {
            color: #666;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

<div class="player">

    <h1>MP3 Player</h1>
    <div class="subtitle">Drag and drop your music below</div>

    <div class="drop-zone" id="dropZone">
        <div class="icon">🎵</div>
        <p><strong>Drop MP3 files here</strong></p>
        <p class="hint">or click to choose files from your computer</p>
        <input type="file" id="fileInput" accept=".mp3,audio/mpeg" multiple>
    </div>

    <div class="now-playing">
        <div class="now-playing-label">Now Playing</div>
        <div id="currentSong">Nothing playing</div>

        <audio id="audioPlayer" controls></audio>

        <div class="controls">
            <button id="previousButton">⏮ Previous</button>
            <button id="nextButton">Next ⏭</button>
            <button class="clear" id="clearButton">Clear Playlist</button>
        </div>
    </div>

    <div class="playlist">
        <div class="playlist-header">
            <h2>Playlist</h2>
            <span id="songCount">0 songs</span>
        </div>

        <div id="playlist">
            <div class="empty">
                Drop some MP3 files above to get started.
            </div>
        </div>
    </div>

</div>

<script>
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const audioPlayer = document.getElementById("audioPlayer");
    const playlistElement = document.getElementById("playlist");
    const currentSong = document.getElementById("currentSong");
    const songCount = document.getElementById("songCount");

    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const clearButton = document.getElementById("clearButton");

    let songs = [];
    let currentIndex = -1;

    // Click the drop zone
    dropZone.addEventListener("click", () => {
        fileInput.click();
    });

    // Files selected normally
    fileInput.addEventListener("change", (event) => {
        addFiles(event.target.files);
        fileInput.value = "";
    });

    // Dragging over
    dropZone.addEventListener("dragover", (event) => {
        event.preventDefault();
        dropZone.classList.add("dragging");
    });

    // Leaving
    dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("dragging");
    });

    // Dropping
    dropZone.addEventListener("drop", (event) => {
        event.preventDefault();

        dropZone.classList.remove("dragging");

        addFiles(event.dataTransfer.files);
    });

    // Add MP3 files
    function addFiles(files) {
        const newFiles = Array.from(files).filter(file =>
            file.type === "audio/mpeg" ||
            file.name.toLowerCase().endsWith(".mp3")
        );

        newFiles.forEach(file => {
            songs.push({
                file: file,
                name: file.name,
                url: URL.createObjectURL(file)
            });
        });

        renderPlaylist();

        // Automatically play first song if nothing is playing
        if (currentIndex === -1 && songs.length > 0) {
            playSong(0);
        }
    }

    // Render playlist
    function renderPlaylist() {
        playlistElement.innerHTML = "";

        songCount.textContent =
            songs.length + (songs.length === 1 ? " song" : " songs");

        if (songs.length === 0) {
            playlistElement.innerHTML = `
                <div class="empty">
                    Drop some MP3 files above to get started.
                </div>
            `;
            return;
        }

        songs.forEach((song, index) => {

            const songElement = document.createElement("div");

            songElement.className =
                "song" + (index === currentIndex ? " active" : "");

            songElement.innerHTML = `
                <div class="song-number">${index + 1}</div>
                <div class="song-name">${escapeHTML(song.name)}</div>
                <div class="song-play">
                    ${index === currentIndex ? "▶" : "♪"}
                </div>
            `;

            songElement.addEventListener("click", () => {
                playSong(index);
            });

            playlistElement.appendChild(songElement);
        });
    }

    // Play a song
    function playSong(index) {

        if (index < 0 || index >= songs.length) {
            return;
        }

        currentIndex = index;

        audioPlayer.src = songs[index].url;
        currentSong.textContent = songs[index].name;

        audioPlayer.play();

        renderPlaylist();
    }

    // Previous
    previousButton.addEventListener("click", () => {

        if (songs.length === 0) return;

        let previousIndex = currentIndex - 1;

        if (previousIndex < 0) {
            previousIndex = songs.length - 1;
        }

        playSong(previousIndex);
    });

    // Next
    nextButton.addEventListener("click", () => {

        if (songs.length === 0) return;

        let nextIndex = currentIndex + 1;

        if (nextIndex >= songs.length) {
            nextIndex = 0;
        }

        playSong(nextIndex);
    });

    // Automatically play next song
    audioPlayer.addEventListener("ended", () => {

        if (songs.length === 0) return;

        let nextIndex = currentIndex + 1;

        if (nextIndex >= songs.length) {
            nextIndex = 0;
        }

        playSong(nextIndex);
    });

    // Clear playlist
    clearButton.addEventListener("click", () => {

        songs.forEach(song => {
            URL.revokeObjectURL(song.url);
        });

        songs = [];
        currentIndex = -1;

        audioPlayer.pause();
        audioPlayer.removeAttribute("src");
        audioPlayer.load();

        currentSong.textContent = "Nothing playing";

        renderPlaylist();
    });

    // Prevent HTML from being inserted through filenames
    function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
